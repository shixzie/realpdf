<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230ea5e9'/%3E%3Cpath d='M9 8h9l5 5v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z' fill='%23fff'/%3E%3Cpath d='M18 8v5h5' fill='none' stroke='%230ea5e9' stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <meta
      name="description"
      content="RealPDF — a fully local, in-browser PDF editor. Annotate, draw, add text and images, fill forms, merge, split and convert PDFs, open Word/Excel/PowerPoint files as editable PDFs, then export to PDF or Office. Your files never leave your device."
    />
    <link rel="canonical" href="https://realpdf.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://realpdf.app/" />
    <meta property="og:title" content="RealPDF — the local PDF editor" />
    <meta
      property="og:description"
      content="Annotate, fill forms, merge, split and convert PDFs — and turn Word, Excel or PowerPoint files into editable PDFs — right in your browser. No uploads, no accounts."
    />
    <meta property="og:image" content="https://realpdf.app/social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>RealPDF — local PDF editor</title>
    <script>
      // Apply the stored (or system) language and theme before first paint to
      // avoid a flash of wrong-language/theme content. Translations live in
      // src/i18n and are applied on boot (see initLocale in src/main.tsx).
      ;(function () {
        try {
          var stored = localStorage.getItem('realpdf-locale')
          document.documentElement.lang = stored || navigator.language || 'en'
        } catch (error) {
          document.documentElement.lang = 'en'
        }
      })()
    </script>
    <script>
      // Apply the stored (or system) theme before first paint to avoid flashes.
      ;(function () {
        try {
          var stored = localStorage.getItem('realpdf-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Ko-fi support widget (configured in src/lib/kofi.ts so its label follows the locale) -->
    <script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
  </body>
</html>
